name: Automated IPO & GMP Scraper

on:
  schedule:
    # Every 30 minutes during Indian stock market hours (9:30 AM - 4:30 PM IST / 04:00 - 11:00 UTC) Mon-Fri
    - cron: '*/30 4-11 * * 1-5'
    # Daily evening refresh at 8:30 PM IST (15:00 UTC)
    - cron: '0 15 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'scraper/requirements.txt'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scraper/requirements.txt

      - name: Run IPO & GMP Scraper
        run: |
          python scraper/scrape_ipos.py

      - name: Commit and Push Updated Data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(data): auto-update IPO & GMP data [skip ci]"
          file_pattern: "public/data/live_ipos.json src/data/live_ipos.json"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "41898282+github-actions[bot]@users.noreply.github.com"
          commit_author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
